# 多平台并行构建 + 打包 + 发布 Release
# 每个平台产出一个完整包：rssust-<版本>-<平台>/ 里含二进制 + docs/ + docs_md/ + index/
# 推 v* tag 触发发布；workflow_dispatch 只构建，不上传 Release
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN_NAME: rssust
  # cargo 按 target 三元组匹配这个变量，只在编 aarch64-unknown-linux-gnu 时生效，
  # 其他 target 不受影响。指向 apt 装的 gcc-aarch64-linux-gnu，不用 cross 的 Docker
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  # 发布包开启的 cargo feature，留空 = 只用 default(docs, cookie)。
  # 想出带 rhai 脚本路由的包，把这里改成 scripts
  FEATURES: ''
  # 打进发布包的 env 子目录。启用 scripts feature 后记得把 scripts 加上，
  # 否则用户会看到 .rhai 文件却没效果
  PACK_DIRS: docs docs_md index

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-latest
            # 光 rustup target add 会在链接阶段挂（没有 aarch64 链接器），
            # 靠上面 CARGO_TARGET_..._LINKER 指向 apt 装的 gcc-aarch64-linux-gnu
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1
          echo "linker=$CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER"

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # git-bash 在 windows runner 上也有，所以这一步三个平台共用
      - name: Read version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"
          # tag 和 Cargo.toml 对不上只警告。老规矩 tag 可能带 -S 后缀，不拦构建
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [ "$tag" != "v$version" ]; then
              echo "::warning::tag $tag 与 Cargo.toml 版本 $version 不一致，产物仍按 $version 命名"
            fi
          fi

      # git-bash 在 windows runner 上也有，cargo 认正斜杠路径，
      # 所以三个平台共用这一步
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}" \
            ${FEATURES:+--features "$FEATURES"}

      # 在各自 runner 上组装完整包。artifact 名 = 包名，下载下来就是能直接跑的东西。
      # 只解压不压缩：windows 的 git-bash 没有 zip，压缩统一交给下面的 release job
      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi

          pack="out/${{ env.BIN_NAME }}-${version}-${{ matrix.name }}"
          rm -rf out
          mkdir -p "$pack"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}${ext}" "$pack/${{ env.BIN_NAME }}${ext}"
          [ -n "$ext" ] || chmod +x "$pack/${{ env.BIN_NAME }}"

          for d in $PACK_DIRS; do
            # 缺目录直接失败。静默跳过会产出一个只有二进制的包，用户拿到才发现
            if [ ! -d "env/$d" ]; then
              echo "::error::env/$d 不存在，PACK_DIRS($PACK_DIRS) 与仓库结构对不上，拒绝出残包"
              exit 1
            fi
            cp -a "env/$d" "$pack/"
          done

          echo "=== $pack 内容:"
          ls -la "$pack"
          find "$pack" -type f | wc -l

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ steps.meta.outputs.version }}-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: build
    # 只有推 tag 才发布；workflow_dispatch 只停在构建+打包
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages

      # 压缩统一在这里做：只有 ubuntu runner 保证有 zip，
      # 省掉在三个 build job 里各写一份 archiver 分支
      - name: Zip and create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          feats="${{ env.FEATURES }}"
          feats=${feats:-default (docs, cookie)}

          echo "=== 收到的包:"; ls -la packages/ || true

          # 先确认真的收到了包再动手，否则 zip 会抛 "Nothing to do!" 那种看不懂的错
          shopt -s nullglob
          packs=(packages/*/)
          shopt -u nullglob
          if [ ${#packs[@]} -eq 0 ]; then
            echo "::error::没收到任何包，packages/ 是空的"
            exit 1
          fi

          rm -rf zips && mkdir -p zips
          # 输入要进 packages/（保住内层目录名），输出用绝对路径，
          # 否则 cd 之后 zips/ 会被解析成 packages/zips/
          zips_abs="$PWD/zips"
          for pack in "${packs[@]}"; do
            name=$(basename "$pack")
            (cd packages && zip -qr "${zips_abs}/${name}.zip" "$name")
            echo "压缩完成 ${name}.zip"
          done

          mapfile -t files < <(find zips -name '*.zip' | sort)
          echo "=== 待上传:"; ls -la "${files[@]}"

          # 同名 release 已存在就补传，不存在就新建
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "Rssust $version" \
              --notes "自动构建，cargo feature: \`$feats\`"
          fi
          gh release view "$tag"
